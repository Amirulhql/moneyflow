  <script>
/* MoneyFlow — vanilla JavaScript, private-first personal finance tracker.
   Transactions, settings and goals persist to this browser's localStorage.
   No remote API, telemetry, advertising, login, or external libraries. */
'use strict';
const KEY='moneyflow_data_v1';
const EXPENSE_CATS=['Food & Drinks','Transport','Shopping','Entertainment','Bills','Health','Education','Groceries','Travel','Others'];
const INCOME_CATS=['Salary','Allowance','Freelance','Gift','Refund','Other Income'];
const EMOJI={'Food & Drinks':'🍜',Transport:'🚗',Shopping:'🛍️',Entertainment:'🎬',Bills:'🧾',Health:'💊',Education:'📚',Groceries:'🛒',Travel:'✈️',Others:'✨',Salary:'💼',Allowance:'🎓',Freelance:'💻',Gift:'🎁',Refund:'↩️','Other Income':'💰'};
const COLORS=['#9d77fa','#4bd5ba','#f2bd73','#f68aa6','#74b4ff','#a5a5fc','#8fd18b','#e5a0ed','#eec78a','#84cac8'];
const $=(selector,root=document)=>root.querySelector(selector);
const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}_${Math.random().toString(36).slice(2,10)}`;
const num=n=>Number.isFinite(Number(n))?Number(n):0;
const money=n=>new Intl.NumberFormat('en-MY',{style:'currency',currency:'MYR',minimumFractionDigits:2,maximumFractionDigits:2}).format(num(n));
const compact=n=>Math.abs(n)>=10000?`RM${(num(n)/1000).toFixed(1)}k`:`RM${num(n).toLocaleString('en-MY',{maximumFractionDigits:0})}`;
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
const today=()=>localDate();
const monthOf=date=>String(date||today()).slice(0,7);
const thisMonth=()=>monthOf(today());
const parseDate=str=>new Date(`${str}T12:00:00`);
const niceDate=str=>parseDate(str).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
const monthName=m=>parseDate(`${m}-01`).toLocaleDateString('en-MY',{month:'long',year:'numeric'});
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const round=n=>Math.round((num(n)+Number.EPSILON)*100)/100;
const icon=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
function seedState(){return {version:1,settings:{monthlyBudget:0,protectedReserve:0,warningCushion:40,theme:'dark',categoryBudgets:{}},accounts:[{id:'cash',name:'Cash',type:'cash',opening:0},{id:'bank',name:'Bank Account',type:'bank',opening:0},{id:'wallet',name:'E-Wallet',type:'wallet',opening:0},{id:'card',name:'Credit Card',type:'credit',opening:0}],transactions:[],goals:[],recurring:[],wishlist:[],customCategories:[],demo:false};}
let db=load();
let ui={tab:'home',settingsTab:'budget',calendarMonth:thisMonth(),selectedDay:'',txMonth:thisMonth(),txKind:'all',txSearch:'',modal:null,afford:{item:'',price:'',category:EXPENSE_CATS[0],priority:'want'},displayMonth:thisMonth()};
let toastTimer;
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seedState();const src=JSON.parse(raw);return normalize(src);}catch(e){console.warn('MoneyFlow load failed:',e);return seedState();}}
function normalize(src){if(!src||typeof src!=='object'||!Array.isArray(src.accounts)||!Array.isArray(src.transactions))throw Error('Invalid MoneyFlow backup');const initial=seedState();return {...initial,...src,settings:{...initial.settings,...src.settings,categoryBudgets:{...src.settings?.categoryBudgets}},accounts:src.accounts.map(a=>({...a,opening:num(a.opening)})),transactions:src.transactions.map(t=>({...t,amount:num(t.amount)})),goals:Array.isArray(src.goals)?src.goals:[],recurring:Array.isArray(src.recurring)?src.recurring:[],wishlist:Array.isArray(src.wishlist)?src.wishlist:[],customCategories:Array.isArray(src.customCategories)?src.customCategories:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true;}catch(e){toast('Could not save changes. Check available browser storage.',true);console.error(e);return false;}}
function mutate(fn,message){const previous=JSON.stringify(db);fn();if(!save()){db=normalize(JSON.parse(previous));render();return false;}render();if(message)toast(message);return true;}
function toast(message,error=false){const root=$('#toast-root');root.innerHTML=`<div class="toast" style="${error?'border-color:#f47d9a;':''}">${esc(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>root.innerHTML='',3500);}
const expenseCategories=()=>[...new Set([...EXPENSE_CATS,...db.customCategories])];
const account=id=>db.accounts.find(a=>a.id===id);
const goal=id=>db.goals.find(g=>g.id===id);
const goalSaved=goalId=>round(db.transactions.reduce((sum,t)=>sum+(t.goalId===goalId?(t.kind==='saving'?t.amount:t.kind==='unsaving'?-t.amount:0):0),0));
const savingsTotal=()=>round(db.goals.reduce((n,g)=>n+goalSaved(g.id),0));
function accountBalance(a){return round(num(a.opening)+db.transactions.reduce((sum,t)=>{if(t.kind==='income'&&t.accountId===a.id)return sum+t.amount;if(t.kind==='expense'&&t.accountId===a.id)return sum-t.amount;if(t.kind==='transfer')return sum+(t.toAccountId===a.id?t.amount:0)-(t.accountId===a.id?t.amount:0);if(t.kind==='saving'&&t.accountId===a.id)return sum-t.amount;if(t.kind==='unsaving'&&t.accountId===a.id)return sum+t.amount;return sum;},0));}
const cashAvailable=()=>round(db.accounts.filter(a=>a.type!=='credit').reduce((n,a)=>n+accountBalance(a),0));
const cardDebt=()=>round(db.accounts.filter(a=>a.type==='credit').reduce((n,a)=>n+Math.max(0,-accountBalance(a)),0));
const netWorth=()=>round(db.accounts.reduce((n,a)=>n+accountBalance(a),0)+savingsTotal());
function monthExpenses(m=thisMonth(),category){return round(db.transactions.filter(t=>t.kind==='expense'&&monthOf(t.date)===m&&(!category||t.category===category)).reduce((n,t)=>n+t.amount,0));}
function monthIncome(m=thisMonth()){return round(db.transactions.filter(t=>t.kind==='income'&&monthOf(t.date)===m).reduce((n,t)=>n+t.amount,0));}
function sumDay(date){return round(db.transactions.filter(t=>t.kind==='expense'&&t.date===date).reduce((n,t)=>n+t.amount,0));}
function remainingDays(){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()+1;}
function categoryTotals(m=thisMonth()){const totals={};db.transactions.filter(t=>t.kind==='expense'&&monthOf(t.date)===m).forEach(t=>totals[t.category||'Others']=(totals[t.category||'Others']||0)+t.amount);return Object.entries(totals).sort((a,b)=>b[1]-a[1]);}
function recurringPaid(bill,m=thisMonth()){return db.transactions.some(t=>t.kind==='expense'&&t.recurringId===bill.id&&monthOf(t.date)===m);}
function unpaidBills(m=thisMonth()){return db.recurring.filter(b=>b.active!==false&&!recurringPaid(b,m));}
const unpaidTotal=(m=thisMonth())=>round(unpaidBills(m).reduce((sum,b)=>sum+num(b.amount),0));
function affordability(price,category,priority='want'){
 const cost=num(price),month=thisMonth(),monthBudget=num(db.settings.monthlyBudget),spent=monthExpenses(month),outstanding=unpaidTotal(month),protectedMoney=Math.max(0,num(db.settings.protectedReserve));
 const availableCash=cashAvailable(),netAfterBills=availableCash-outstanding-protectedMoney;
 const monthlyLeft=monthBudget>0?monthBudget-spent-outstanding:Infinity;
 const catBudget=num(db.settings.categoryBudgets?.[category]);
 const catLeft=catBudget>0?catBudget-monthExpenses(month,category):Infinity;
 const discretionary=Math.min(netAfterBills,monthlyLeft,catLeft);
 const after=discretionary-cost,days=remainingDays(),cushion=clamp(num(db.settings.warningCushion)||40,0,90)/100;
 const floorRatio=priority==='need'?cushion*.625:cushion;
 let status='green';
 if(cost<=0)status='idle';
 else if(after<-.0001||catLeft<cost||netAfterBills<cost)status='red';
 else if(monthBudget<=0||discretionary<=0||after/Math.max(discretionary,.01)<floorRatio)status='yellow';
 return {cost,availableCash,monthBudget,spent,outstanding,protectedMoney,monthlyLeft,catBudget,catLeft,discretionary,after,days,dailyAfter:Math.max(0,after)/days,dailyBefore:Math.max(0,discretionary)/days,status,floorRatio};
}
function statusLabel(status){return status==='green'?'You Can Afford It':status==='red'?'Not Recommended':status==='yellow'?'Think Twice':'Enter a purchase price';}
function spendChange(){const d=new Date(),prev=new Date(d.getFullYear(),d.getMonth()-1,1);const old=monthExpenses(monthOf(localDate(prev))),cur=monthExpenses();return old>0?((cur-old)/old)*100:null;}
function previousMonth(m){const d=parseDate(`${m}-01`);d.setMonth(d.getMonth()-1);return monthOf(localDate(d));}
function nextMonth(m){const d=parseDate(`${m}-01`);d.setMonth(d.getMonth()+1);return monthOf(localDate(d));}
function pct(n,max){return max>0?clamp(n/max*100,0,100):0;}
function fmtSigned(t){return `${t.kind==='income'||t.kind==='unsaving'?'+':t.kind==='expense'||t.kind==='saving'?'-':''}${money(t.amount)}`;}
function description(t){if(t.kind==='transfer')return `${account(t.accountId)?.name||'Account'} → ${account(t.toAccountId)?.name||'Account'}`;if(t.kind==='saving')return `To ${goal(t.goalId)?.name||'Savings goal'}`;if(t.kind==='unsaving')return `From ${goal(t.goalId)?.name||'Savings goal'}`;return t.description||t.category||'Transaction';}
function txEmoji(t){if(t.kind==='transfer')return '🔄';if(t.kind==='saving')return '🎯';if(t.kind==='unsaving')return '🏦';return EMOJI[t.category]||'💳';}
function txRows(items,showActions=false){if(!items.length)return emptyState('list','No transactions yet','Add an expense or income to start tracking your money.',"<button class='button sm primary' data-action='new-tx'>Add transaction</button>");return `<div class="list">${items.map(t=>`<div class="tx-row"><div class="tx-symbol">${txEmoji(t)}</div><div class="tx-info"><div class="tx-title">${esc(description(t))}</div><div class="tx-sub">${esc(t.kind[0].toUpperCase()+t.kind.slice(1))} · ${esc(t.kind==='saving'||t.kind==='unsaving'?goal(t.goalId)?.name||'Savings':account(t.accountId)?.name||'Account')} · ${niceDate(t.date)}</div></div><div class="tx-right"><span class="tx-amount numbers ${t.kind==='income'||t.kind==='unsaving'?'green':t.kind==='expense'?'':'purple'}">${fmtSigned(t)}</span>${showActions?`<div class="tx-actions"><button class="button ghost" title="Edit transaction" aria-label="Edit transaction" data-action="edit-tx" data-id="${esc(t.id)}">${icon('edit')}</button><button class="button ghost red" title="Delete transaction" aria-label="Delete transaction" data-action="delete-tx" data-id="${esc(t.id)}">${icon('trash')}</button></div>`:''}</div></div>`).join('')}</div>`;}
function emptyState(ic,title,body,extra=''){return `<div class="empty">${icon(ic)}<h3>${esc(title)}</h3><p>${esc(body)}</p>${extra}</div>`;}
function navButton(key,name,ic){return `<button class="nav-btn ${ui.tab===key?'active':''}" data-tab="${key}" ${ui.tab===key?'aria-current="page"':''}>${icon(ic)}<span>${name}</span></button>`;}
function render(){document.documentElement.dataset.theme=db.settings.theme==='light'?'light':'dark';document.querySelector('meta[name=theme-color]')?.setAttribute('content',db.settings.theme==='light'?'#f6f5fa':'#12101a');const titles={home:'Dashboard',transactions:'Transactions',afford:'Affordability',analytics:'Analytics',settings:'Settings'};$('#app').innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-icon">${icon('chart')}</div><div><div class="brand-name">MoneyFlow</div><div class="brand-sub">Personal finance</div></div></div><nav class="nav-list" aria-label="Main navigation">${navButton('home','Home','home')}${navButton('transactions','Transactions','list')}${navButton('afford','Can I Afford This?','spark')}${navButton('analytics','Analytics','chart')}${navButton('settings','Settings','settings')}</nav><div class="sidebar-bottom"><div class="privacy-box">${icon('shield')} <b>Private by design</b><p>Your financial data stays in this browser. Export a backup in Settings.</p></div></div></aside><main class="main"><div class="main-inner"><header class="topbar"><div><div class="eyebrow">${new Date().toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>${titles[ui.tab]}</h1></div><div class="topbar-right"><button class="button ghost icon-only" aria-label="Toggle color theme" title="Toggle color theme" data-action="theme">${icon(db.settings.theme==='dark'?'sun':'moon')}</button><button class="button primary add-desktop" data-action="new-tx">${icon('plus')} Add transaction</button></div></header>${db.demo?`<div class="warning-note mb18"><b>Sample data loaded.</b> These are fictional transactions for testing. Go to Settings → Data to clear them before using MoneyFlow with real finances.</div>`:''}${renderPage()}</div></main><nav class="mobile-nav" aria-label="Mobile navigation">${navButton('home','Home','home')}${navButton('transactions','History','list')}${navButton('afford','Afford','spark')}${navButton('analytics','Insights','chart')}${navButton('settings','Settings','settings')}</nav><button class="fab" aria-label="Add transaction" data-action="new-tx">${icon('plus')}</button></div>`;}
function renderPage(){return {home:renderHome,transactions:renderTransactions,afford:renderAfford,analytics:renderAnalytics,settings:renderSettings}[ui.tab]();}
function renderThemeIcon(){return icon(db.settings.theme==='dark'?'sun':'moon');}
function budgetBadge(){const budget=num(db.settings.monthlyBudget),used=monthExpenses();if(!budget)return '<span class="pill warning">Set a budget</span>';const ratio=used/budget;return ratio>=1?'<span class="pill danger">Budget exceeded</span>':ratio>=.9?'<span class="pill warning">90%+ used</span>':ratio>=.8?'<span class="pill warning">80%+ used</span>':'<span class="pill success">On track</span>';}
function budgetCard(){const budget=num(db.settings.monthlyBudget),used=monthExpenses(),left=budget-used;return `<section class="card"><div class="card-heading"><div class="card-title">Monthly budget</div>${budgetBadge()}</div>${budget?`<div class="tiny">Remaining for ${monthName(thisMonth())}</div><div class="budget-display numbers ${left<0?'red':''}">${money(left)}</div><div class="progress-meta"><span class="tiny">${money(used)} spent</span><span class="tiny">${Math.round(used/budget*100)}% of ${money(budget)}</span></div><div class="progress-track"><div class="progress-fill ${used>=budget?'red-fill':''}" style="width:${pct(used,budget)}%"></div></div><div class="mini-stat mt12"><span>Safe daily average (budget only)</span><strong>${money(Math.max(0,left)/remainingDays())}</strong></div>`:`<p class="subtle-text" style="font-size:13px;line-height:1.6;margin:10px 0 16px">Set a monthly budget to track progress and power the purchase calculator.</p><button class="button primary sm" data-action="go-settings-budget">${icon('target')} Set monthly budget</button>`}</section>`;}
function metricCard(name,n,foot,ic,color){return `<section class="card metric-card"><div class="label-line"><span class="tiny">${name}</span><div class="metric-icon" style="background:color-mix(in srgb,var(--${color}) 12%,transparent);color:var(--${color})">${icon(ic)}</div></div><div class="metric numbers">${money(n)}</div><div class="metric-foot">${foot}</div></section>`;}
function donutChart(m=thisMonth()){const totals=categoryTotals(m),sum=totals.reduce((a,b)=>a+b[1],0);if(!sum)return emptyState('chart','Nothing to chart yet','Add your first expense and see your category breakdown.');let pos=0;const gradients=totals.map(([name,val],i)=>{const start=pos;pos+=(val/sum)*100;return `${COLORS[i%COLORS.length]} ${start.toFixed(3)}% ${pos.toFixed(3)}%`;}).join(',');return `<div class="donut-layout"><div class="donut" style="background:conic-gradient(${gradients})"><div class="donut-hole"><b class="numbers">${compact(sum)}</b><small>Total spent</small></div></div><div class="legend">${totals.slice(0,6).map(([name,val],i)=>`<div class="legend-row"><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span><span class="name">${esc(name)}</span><b>${Math.round(val/sum*100)}%</b></div>`).join('')}${totals.length>6?`<small>+ ${totals.length-6} more categories</small>`:''}</div></div>`;}
function weekChart(){const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {date:localDate(d),label:d.toLocaleDateString('en-MY',{weekday:'short'}),amount:sumDay(localDate(d))};});const mx=Math.max(1,...days.map(x=>x.amount));return `<div class="bars" role="img" aria-label="Expense totals over the past seven days">${days.map(day=>`<div class="bar-col"><div class="bar" tabindex="0" aria-label="${esc(day.label)} ${money(day.amount)}" style="height:${Math.max(2,day.amount/mx*100)}%"><span class="bar-tip">${money(day.amount)}</span></div><small>${day.label}</small></div>`).join('')}</div>`;}
function renderHome(){const income=monthIncome(),spent=monthExpenses(),balance=cashAvailable(),recent=[...db.transactions].sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,5),pending=unpaidBills().sort((a,b)=>num(a.day)-num(b.day));const free=affordability(0,'Others','want');return `<section class="grid home-layout"><div class="card hero"><div><div class="hero-label tiny">Available cash balance</div><div class="hero-number numbers">${money(balance)}</div><small>Cash, bank & e-wallet · Credit card excluded</small></div><div class="hero-footer"><div class="hero-meta"><div><small>Monthly income</small><b>${money(income)}</b></div><div><small>Total net worth</small><b>${money(netWorth())}</b></div></div><button class="button sm" data-tab="transactions">${icon('arrows')} View accounts</button></div></div>${budgetCard()}</section><section class="grid cols-4 section-space">${metricCard('Spent today',sumDay(today()),'Your expense total today','arrow-up','red')}${metricCard('Spent this month',spent,monthName(thisMonth()),'wallet','purple')}${metricCard('Income this month',income,'Income received','arrow-down','green')}${metricCard('Savings goals',savingsTotal(),`${db.goals.length} active goal${db.goals.length===1?'':'s'}`,'target','purple')}</section><section class="grid home-layout section-space"><div class="card"><div class="card-heading"><div class="card-title">Spending overview</div><span class="pill">Last 7 days</span></div>${weekChart()}</div><div class="card"><div class="card-heading"><div class="card-title">Where your money went</div><span class="tiny">This month</span></div>${donutChart()}</div></section><section class="grid home-layout section-space"><div class="card"><div class="card-heading"><div class="card-title">Recent transactions</div><button class="button sm ghost" data-tab="transactions">View all ${icon('chevron-right')}</button></div>${txRows(recent)}</div><div class="grid" style="align-content:start"><div class="card"><div class="card-heading"><div class="card-title">Your purchase power</div>${icon('spark','purple')}</div><div class="tiny">Available after unpaid bills, protected savings, and budget limits</div><div class="budget-display numbers">${money(Math.max(0,free.discretionary))}</div><div class="mini-stat"><span>Unpaid recurring bills</span><strong>${money(free.outstanding)}</strong></div><div class="mini-stat"><span>Suggested per day</span><strong>${money(Math.max(0,free.dailyBefore))}</strong></div><button class="button primary full-width mt20" data-tab="afford">${icon('spark')} Can I afford this?</button></div><div class="card"><div class="card-heading"><div class="card-title">Upcoming bills</div><button class="button sm ghost" data-action="go-recurring">Manage</button></div>${pending.length?pending.slice(0,3).map(b=>`<div class="upcoming-row"><div><b>${esc(b.title)}</b><small>Due day ${num(b.day)} · ${esc(b.category)}</small></div><strong class="numbers">${money(b.amount)}</strong></div>`).join(''):`<p class="tiny">No unpaid recurring bills registered this month.</p>`}</div></div></section>`;}
function calendar(){const m=ui.calendarMonth,first=parseDate(`${m}-01`),year=first.getFullYear(),month=first.getMonth(),last=new Date(year,month+1,0).getDate(),offset=(first.getDay()+6)%7;let days='';for(let i=0;i<offset;i++)days+='<span class="day empty-day"></span>';for(let d=1;d<=last;d++){const date=`${m}-${String(d).padStart(2,'0')}`,amt=sumDay(date);days+=`<button class="day ${date===today()?'today':''} ${ui.selectedDay===date?'selected':''}" data-action="pick-day" data-date="${date}" aria-label="${niceDate(date)} spent ${money(amt)}"><span>${d}</span>${amt>0?`<small>${compact(amt)}</small>`:''}</button>`;}return `<div class="calendar-toolbar"><button class="button ghost sm icon-only" data-action="cal-prev" aria-label="Previous month">${icon('chevron-left')}</button><b>${monthName(m)}</b><button class="button ghost sm icon-only" data-action="cal-next" aria-label="Next month">${icon('chevron-right')}</button></div><div class="calendar-days">${['M','T','W','T','F','S','S'].map(n=>`<span class="weekday">${n}</span>`).join('')}${days}</div><div class="calendar-key">${ui.selectedDay?`Showing ${niceDate(ui.selectedDay)}. <button class="button sm ghost" data-action="clear-day">Clear selection</button>`:'Tap a day to filter your transactions.'}</div>`;}
function renderTransactions(){const items=[...db.transactions].filter(t=>(!ui.selectedDay?monthOf(t.date)===ui.txMonth:t.date===ui.selectedDay)&&(ui.txKind==='all'||t.kind===ui.txKind)&&(!ui.txSearch||`${description(t)} ${t.category} ${account(t.accountId)?.name||''}`.toLowerCase().includes(ui.txSearch.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||'')));return `<div class="page-intro"><div><h2>Money in, money out</h2><p>Track every ringgit. Transfers and savings deposits won't count as expenses.</p></div><button class="button ghost sm" data-action="new-tx">${icon('plus')} New</button></div><div class="account-strip mb18">${db.accounts.map(a=>`<div class="card-surface"><div class="flex space-between"><small>${esc(a.name)}</small><span class="pill">${a.type==='credit'?'Credit':a.type==='wallet'?'E-Wallet':a.type==='cash'?'Cash':'Bank'}</span></div><b class="numbers ${accountBalance(a)<0?'red':''}">${money(accountBalance(a))}</b><small>${a.type==='credit'?'Negative balance is card debt':'Current account balance'}</small></div>`).join('')}</div><div class="grid report-layout"><section class="card"><div class="card-heading"><div class="card-title">Transaction history</div><span class="pill">${items.length} record${items.length===1?'':'s'}</span></div><div class="filterbar"><div class="searchbox">${icon('search')}<input id="tx-search" type="search" value="${esc(ui.txSearch)}" placeholder="Search transactions" aria-label="Search transactions"></div><input type="month" id="tx-month" value="${esc(ui.txMonth)}" aria-label="Transaction month"><select id="tx-kind" aria-label="Filter transaction type">${[['all','All types'],['expense','Expenses'],['income','Income'],['transfer','Transfers'],['saving','Savings deposits'],['unsaving','Savings withdrawals']].map(([v,n])=>`<option value="${v}" ${ui.txKind===v?'selected':''}>${n}</option>`).join('')}</select></div>${txRows(items,true)}</section><div class="grid" style="align-content:start"><section class="card"><div class="card-heading"><div class="card-title">Spending calendar</div>${icon('calendar','purple')}</div>${calendar()}</section><section class="card"><div class="card-title mb12">${monthName(ui.txMonth)} summary</div><div class="mini-stat"><span>Expenses</span><strong class="numbers">${money(monthExpenses(ui.txMonth))}</strong></div><div class="mini-stat"><span>Income</span><strong class="numbers green">${money(monthIncome(ui.txMonth))}</strong></div><div class="mini-stat"><span>Net cash flow, excl. transfers</span><strong class="numbers">${money(monthIncome(ui.txMonth)-monthExpenses(ui.txMonth))}</strong></div><p class="tiny mt12">Savings transfers are excluded from spending and income here.</p></section></div></div>`;}
function affordabilityResult(){const {item,price,category,priority}=ui.afford,r=affordability(price,category,priority),status=r.status;const explanation=status==='idle'?'Enter the item price to get a personalized estimate.':status==='red'?`This purchase would exceed at least one limit after reserving unpaid bills and protected money. Consider waiting, reducing the price, or revising your budget.`:status==='yellow'?(r.monthBudget<=0?'Your monthly budget is not set, so MoneyFlow cannot give a confident green recommendation. Set a budget in Settings.':'This fits the absolute limits but leaves a smaller safety cushion for the rest of the month. Think about your other expected spending.'): 'This purchase fits your available money and budget while preserving the configured safety cushion.';const color=status==='green'?'green':status==='red'?'red':'yellow';const reasons=[['Cash & e-wallet balance',money(r.availableCash)],['Unpaid bills this month',`− ${money(r.outstanding)}`],['Extra protected reserve',`− ${money(r.protectedMoney)}`],['Unspent monthly budget',r.monthBudget>0?money(r.monthBudget-r.spent):'Not set'],['Category limit',r.catBudget>0?money(r.catLeft):'No limit'],['Usable before purchase',money(Math.max(0,r.discretionary))]];return `<div class="afford-status ${status==='idle'?'':`${color}-bg`}"><div class="flex">${icon(status==='red'?'x':status==='green'?'check':'info',color)}<span class="tiny">PURCHASE ASSESSMENT</span></div><h2 class="${color}">${statusLabel(status)}</h2><p>${esc(explanation)}</p></div><div class="grid cols-2 mt12"><div class="summary-mini"><small>After purchase</small><b class="numbers ${r.after<0?'red':''}">${money(Number.isFinite(r.after)?r.after:0)}</b></div><div class="summary-mini"><small>Daily allowance after</small><b class="numbers">${money(r.dailyAfter)}</b></div></div><div class="card-surface mt12"><div class="card-title mb12">How we calculated it</div>${reasons.map(([name,val])=>`<div class="mini-stat"><span>${name}</span><strong>${val}</strong></div>`).join('')}<div class="mini-stat"><span>Purchase price</span><strong>${money(r.cost)}</strong></div><div class="mini-stat"><span>Days including today</span><strong>${r.days}</strong></div><p class="tiny mt12" style="line-height:1.7">Available to spend is the smallest of cash after reserves, monthly budget after expenses and unpaid bills, and this category's budget (if set). Savings goal deposits are already deducted from cash and aren't subtracted again. ${priority==='want'?'Wants':'Needs'} keep a ${Math.round(r.floorRatio*100)}% suggested buffer for a green result. The estimate excludes unrecorded future spending and is not financial advice.</p></div>`;}
function renderAfford(){return `<div class="page-intro"><div><h2>Think before you spend</h2><p>Get a budget-based estimate before buying something.</p></div><span class="pill">${icon('spark')} Smart purchase check</span></div><div class="grid report-layout"><section class="card afford-head"><div class="card-heading"><div><div class="card-title">Can I afford this?</div><p class="tiny mt12">Enter what you're thinking of buying.</p></div><div class="icon-pill">${icon('spark')}</div></div><div class="field-grid"><div class="field full"><label for="afford-item">What would you like to buy?</label><input id="afford-item" maxlength="100" value="${esc(ui.afford.item)}" placeholder="e.g. New headphones"></div><div class="field full"><label for="afford-price">How much does it cost? (RM)</label><input id="afford-price" type="number" min="0" max="999999999" step="0.01" value="${esc(ui.afford.price)}" placeholder="0.00"></div><div class="field"><label for="afford-category">Category</label><select id="afford-category">${expenseCategories().map(c=>`<option value="${esc(c)}" ${ui.afford.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label for="afford-priority">Priority</label><select id="afford-priority"><option value="want" ${ui.afford.priority==='want'?'selected':''}>Want</option><option value="need" ${ui.afford.priority==='need'?'selected':''}>Need</option></select></div></div><div class="grid cols-2 mt20"><button class="button ghost" data-action="wishlist-save">${icon('target')} Save for later</button><button class="button primary" data-action="purchase-record">${icon('plus')} Record purchase</button></div><p class="tiny mt12" style="line-height:1.7">Saving for later does not deduct any money. Recording a purchase adds an expense only after you confirm it.</p></section><section class="card" id="afford-output">${affordabilityResult()}</section></div><section class="card section-space"><div class="card-heading"><div class="card-title">Your saved wishlist</div><span class="pill">${db.wishlist.length} saved</span></div>${db.wishlist.length?`<div class="list">${db.wishlist.map(w=>`<div class="wishlist-item"><div><strong>${esc(w.name)}</strong><small>${esc(w.category)} · ${esc(w.priority==='need'?'Need':'Want')} · ${money(w.price)}</small></div><div class="flex"><button class="button sm ghost" data-action="wishlist-check" data-id="${esc(w.id)}">Check</button><button class="button sm ghost red" title="Remove wishlist item" aria-label="Remove wishlist item" data-action="wishlist-delete" data-id="${esc(w.id)}">${icon('trash')}</button></div></div>`).join('')}</div>`:emptyState('target','No saved purchases','Save an item you are considering, then check it again later.')}</section>`;}
function monthSeries(){let current=thisMonth(),months=[];for(let i=0;i<6;i++){months.unshift(current);current=previousMonth(current);}return months.map(m=>({month:m,short:parseDate(`${m}-01`).toLocaleDateString('en-MY',{month:'short'}),income:monthIncome(m),expense:monthExpenses(m)}));}
function renderAnalytics(){const series=monthSeries(),maximum=Math.max(1,...series.flatMap(m=>[m.income,m.expense])),spent=monthExpenses(),income=monthIncome(),changes=spendChange(),cat=categoryTotals(),budget=num(db.settings.monthlyBudget);return `<div class="page-intro"><div><h2>Know your spending habits</h2><p>Real-time insights derived from your recorded transactions.</p></div><span class="pill">${icon('chart')} ${monthName(thisMonth())}</span></div><section class="grid cols-3"><div class="card"><div class="tiny">Total monthly income</div><div class="metric green">${money(income)}</div><div class="tiny mt12">Based on recorded income</div></div><div class="card"><div class="tiny">Total monthly expenses</div><div class="metric">${money(spent)}</div><div class="tiny mt12">${changes===null?'No previous-month comparison yet':`${changes>=0?'+':''}${changes.toFixed(1)}% vs previous month`}</div></div><div class="card"><div class="tiny">Net monthly flow</div><div class="metric ${income-spent>=0?'green':'red'}">${money(income-spent)}</div><div class="tiny mt12">Income − expenses (not transfers)</div></div></section><section class="grid report-layout section-space"><div class="card"><div class="card-heading"><div class="card-title">Last 6 months</div><span class="pill">Income vs expenses</span></div><div class="flex gap8 mb12"><span class="dot" style="background:var(--green)"></span><span class="tiny">Income</span><span class="dot" style="background:var(--purple)"></span><span class="tiny">Expenses</span></div><div class="bars" style="height:230px">${series.map(m=>`<div class="bar-col"><div class="flex" style="align-items:end;justify-content:center;gap:4px;height:100%;width:100%"><div class="bar" tabindex="0" title="${esc(m.short)} income: ${money(m.income)}" style="background:var(--green);height:${Math.max(2,m.income/maximum*100)}%;width:38%"><span class="bar-tip">${money(m.income)}</span></div><div class="bar" tabindex="0" title="${esc(m.short)} expenses: ${money(m.expense)}" style="height:${Math.max(2,m.expense/maximum*100)}%;width:38%"><span class="bar-tip">${money(m.expense)}</span></div></div><small>${m.short}</small></div>`).join('')}</div></div><div class="card"><div class="card-heading"><div class="card-title">Category breakdown</div><span class="tiny">This month</span></div>${donutChart()}</div></section><section class="grid report-layout section-space"><div class="card"><div class="card-heading"><div class="card-title">Spending categories</div><span class="pill">${cat.length} used</span></div>${cat.length?cat.map(([name,amount],i)=>`<div class="category-budget-row"><b style="text-align:left">${esc(EMOJI[name]||'✨')} ${esc(name)}</b><b>${money(amount)}</b><div class="small-progress"><span style="background:${COLORS[i%COLORS.length]};width:${pct(amount,spent)}%"></span></div></div>`).join(''):emptyState('chart','No category data','Add expenses to see exactly where your money goes.')}</div><div class="card"><div class="card-heading"><div class="card-title">Your financial snapshot</div>${icon('info','purple')}</div><div class="mini-stat"><span>Monthly budget</span><b>${budget?money(budget):'Not set'}</b></div><div class="mini-stat"><span>Remaining budget</span><b>${budget?money(budget-spent):'Not set'}</b></div><div class="mini-stat"><span>Average per day this month</span><b>${money(spent/new Date().getDate())}</b></div><div class="mini-stat"><span>Unpaid monthly bills</span><b>${money(unpaidTotal())}</b></div><div class="mini-stat"><span>Available cash</span><b>${money(cashAvailable())}</b></div><div class="mini-stat"><span>Credit card debt</span><b>${money(cardDebt())}</b></div><div class="mini-stat"><span>Saved for goals</span><b>${money(savingsTotal())}</b></div><div class="mini-stat"><span>Total net worth</span><b>${money(netWorth())}</b></div><p class="tiny mt12" style="line-height:1.6">Account transfers and savings contributions do not count as income or spending. Credit card purchases count once, when recorded as expenses. Card repayments count only as transfers.</p></div></section>`;}
function accountOptions(selected,omit){return db.accounts.filter(a=>a.id!==omit).map(a=>`<option value="${esc(a.id)}" ${selected===a.id?'selected':''}>${esc(a.name)} (${money(accountBalance(a))})</option>`).join('');}
function categoryOptions(selected,kind='expense'){return (kind==='income'?INCOME_CATS:expenseCategories()).map(c=>`<option value="${esc(c)}" ${selected===c?'selected':''}>${esc(c)}</option>`).join('');}
function renderSettings(){const tabs=[['budget','Budgets'],['accounts','Accounts'],['recurring','Recurring bills'],['savings','Savings goals'],['data','Data & privacy']];return `<div class="page-intro"><div><h2>Make MoneyFlow yours</h2><p>Configure the rules that power your financial dashboard.</p></div></div><div class="segmented settings-tabs">${tabs.map(([key,name])=>`<button class="seg-btn ${ui.settingsTab===key?'active':''}" data-action="settings-tab" data-value="${key}">${name}</button>`).join('')}</div>${{budget:settingsBudget,accounts:settingsAccounts,recurring:settingsRecurring,savings:settingsSavings,data:settingsData}[ui.settingsTab]()}`;}
function settingsBudget(){const budget=num(db.settings.monthlyBudget),spend=monthExpenses();const categories=[...new Set([...expenseCategories(),...Object.keys(db.settings.categoryBudgets||{})])];return `<div class="grid report-layout"><div><section class="card setting-card"><div class="card-title">Monthly spending plan</div><p>Set a total monthly limit, extra protected cash, and how cautious the green purchase recommendation should be.</p><form id="budget-form"><div class="field-grid"><div class="field"><label for="monthly-budget">Monthly expense budget (RM)</label><input id="monthly-budget" type="number" name="monthlyBudget" required min="0" max="999999999" step="0.01" value="${esc(db.settings.monthlyBudget)}"></div><div class="field"><label for="protected-reserve">Additional protected cash (RM)</label><input id="protected-reserve" type="number" name="protectedReserve" required min="0" max="999999999" step="0.01" value="${esc(db.settings.protectedReserve)}"><div class="field-help">Money you don't want to spend, separate from funded savings goals.</div></div><div class="field full"><label for="warning-cushion">Minimum buffer for green recommendation (%)</label><input id="warning-cushion" type="number" name="warningCushion" required min="0" max="90" step="1" value="${esc(db.settings.warningCushion)}"><div class="field-help">Default 40% for wants; needs use 62.5% of that buffer.</div></div></div><div class="form-actions"><button type="submit" class="button primary">${icon('check')} Save budget</button></div></form></section><section class="card"><div class="card-heading"><div class="card-title">Category spending limits</div><span class="pill">Monthly</span></div>${categories.map(c=>{const limit=num(db.settings.categoryBudgets?.[c]),used=monthExpenses(thisMonth(),c);return `<div class="setting-row"><div style="flex:1;min-width:0"><b>${esc(EMOJI[c]||'✨')} ${esc(c)}</b><small>${money(used)} spent ${limit?`of ${money(limit)}`:'· No limit'}</small>${limit?`<div class="small-progress"><span style="width:${pct(used,limit)}%;background:${used>limit?'var(--red)':'var(--purple)'}"></span></div>`:''}</div><button class="button ghost sm" data-action="category-limit" data-category="${esc(c)}">${limit?'Edit':'Set limit'}</button></div>`;}).join('')}</section></div><div class="grid" style="align-content:start"><section class="card"><div class="card-title mb12">Monthly progress</div><div class="budget-display">${budget?money(budget-spend):'No budget set'}</div>${budget?`<div class="progress-track"><div class="progress-fill" style="width:${pct(spend,budget)}%"></div></div>`:''}<div class="mini-stat mt12"><span>Spent this month</span><b>${money(spend)}</b></div><div class="mini-stat"><span>Monthly limit</span><b>${money(budget)}</b></div><div class="mini-stat"><span>Reserved unpaid bills</span><b>${money(unpaidTotal())}</b></div></section><section class="card"><div class="card-title mb12">Custom categories</div><form id="category-form" class="form-inline"><div class="field"><label>Category name</label><input name="name" required maxlength="35" placeholder="e.g. Coffee"></div><button class="button primary" type="submit">${icon('plus')} Add</button></form><p class="tiny mt12">Custom categories can be assigned to new transactions and given individual budgets. Categories used by existing expenses are preserved.</p></section></div></div>`;}
function settingsAccounts(){return `<div class="grid report-layout"><div><section class="card setting-card"><div class="card-title">Manage your accounts</div><p>Set an opening balance for each account. Use a negative opening balance for outstanding credit-card debt. Transfers move money without affecting expense totals.</p>${db.accounts.map(a=>`<div class="setting-row"><div><b>${esc(a.name)} <span class="pill">${esc(a.type)}</span></b><small>Opening: ${money(a.opening)} · Current: ${money(accountBalance(a))}</small></div><div class="flex"><button class="button sm ghost" data-action="edit-account" data-id="${esc(a.id)}">Edit</button><button class="button sm ghost red" data-action="delete-account" data-id="${esc(a.id)}" aria-label="Delete ${esc(a.name)}">${icon('trash')}</button></div></div>`).join('')}</section></div><section class="card" style="align-self:start"><div class="card-title">Add an account</div><p class="tiny mt12 mb18">Cash, bank, e-wallet or credit card.</p><form id="account-form"><div class="field mb12"><label>Account name</label><input name="name" maxlength="40" required placeholder="e.g. Maybank Savings"></div><div class="field mb12"><label>Account type</label><select name="type"><option value="bank">Bank</option><option value="cash">Cash</option><option value="wallet">E-Wallet</option><option value="credit">Credit card</option></select></div><div class="field mb12"><label>Opening balance (RM)</label><input type="number" name="opening" required value="0" step="0.01" min="-999999999" max="999999999"></div><button type="submit" class="button primary full-width">${icon('plus')} Add account</button></form></section></div>`;}

function savingsEditModal(t){const g=goal(t.goalId);if(!g)return toast('This savings goal no longer exists.',true);ui.modal='edit-saving';modalShell(`Edit ${t.kind==='saving'?'savings deposit':'savings withdrawal'}`,`<form id="savings-edit-form" data-id="${esc(t.id)}"><p class="tiny mb18">Goal: ${esc(g.name)}. These funds are transfers, not income or expenses.</p><div class="field-grid"><div class="field"><label>Amount (RM)</label><input name="amount" type="number" required min="0.01" max="999999999" step="0.01" value="${t.amount}"></div><div class="field"><label>Date</label><input name="date" type="date" required value="${esc(t.date)}"></div><div class="field full"><label>Account</label><select name="accountId">${accountOptions(t.accountId)}</select></div></div><div class="form-actions"><button type="button" class="button ghost" data-action="close-modal">Cancel</button><button type="submit" class="button primary">Save changes</button></div></form>`);}
function validAmount(value,allowZero=false){const n=Number(value);return Number.isFinite(n)&&n>=0&&n<=999999999&&(allowZero||n>0)&&Math.abs(n*100-Math.round(n*100))<.0001;}
function getValue(fd,key){return String(fd.get(key)||'').trim();}
function setTheme(t){mutate(()=>{db.settings.theme=t;},'Appearance updated');}
function handleSubmit(event){const form=event.target;if(!form.id)return;event.preventDefault();const f=new FormData(form);const get=k=>getValue(f,k);const amount=round(Number(get('amount')));switch(form.id){
 case 'transaction-form':{
  if(!validAmount(get('amount')))return toast('Enter an amount greater than zero, with at most two decimal places.',true);
  const kind=get('kind'),accountId=get('accountId'),toAccountId=get('toAccountId'),date=get('date');if(!['expense','income','transfer'].includes(kind)||!account(accountId)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Please check the required fields.',true);
  if(kind==='transfer'&&(!account(toAccountId)||accountId===toAccountId))return toast('Choose two different accounts for a transfer.',true);
  const existing=db.transactions.find(t=>t.id===form.dataset.id),entry={id:existing?.id||id(),kind,date,amount,description:get('description').slice(0,140),category:kind==='transfer'?'':get('category'),accountId,toAccountId:kind==='transfer'?toAccountId:null,createdAt:existing?.createdAt||new Date().toISOString(),recurringId:kind==='expense'?existing?.recurringId||null:null};
  mutate(()=>{if(existing)Object.assign(existing,entry);else db.transactions.push(entry);},existing?'Transaction updated':'Transaction added');closeModal();break;}
 case 'budget-form':{
  const budget=get('monthlyBudget'),reserve=get('protectedReserve'),cushion=Number(get('warningCushion'));if(!validAmount(budget,true)||!validAmount(reserve,true)||!Number.isInteger(cushion)||cushion<0||cushion>90)return toast('Enter valid budget settings.',true);
  mutate(()=>{db.settings.monthlyBudget=round(budget);db.settings.protectedReserve=round(reserve);db.settings.warningCushion=cushion;},'Budget settings saved');break;}
 case 'category-form':{
  const name=get('name').slice(0,35);if(!name)return toast('Enter a category name.',true);if(expenseCategories().some(c=>c.toLowerCase()===name.toLowerCase()))return toast('This category already exists.',true);
  mutate(()=>db.customCategories.push(name),'Category added');break;}
 case 'category-budget-form':{
  const limit=get('limit'),category=form.dataset.category;if(!validAmount(limit,true)||!expenseCategories().includes(category))return toast('Enter a valid category limit.',true);mutate(()=>{if(Number(limit)===0)delete db.settings.categoryBudgets[category];else db.settings.categoryBudgets[category]=round(limit);},'Category limit saved');closeModal();break;}
 case 'account-form':{
  const name=get('name').slice(0,40),type=get('type'),opening=Number(get('opening'));if(!name||!['cash','bank','wallet','credit'].includes(type)||!Number.isFinite(opening)||Math.abs(opening)>999999999||Math.abs(opening*100-Math.round(opening*100))>.0001)return toast('Enter valid account details.',true);
  mutate(()=>db.accounts.push({id:id(),name,type,opening:round(opening)}),'Account created');break;}
 case 'account-edit-form':{
  const a=account(form.dataset.id),name=get('name').slice(0,40),type=get('type'),opening=Number(get('opening'));if(!a||!name||!['cash','bank','wallet','credit'].includes(type)||!Number.isFinite(opening)||Math.abs(opening)>999999999||Math.abs(opening*100-Math.round(opening*100))>.0001)return toast('Invalid account details.',true);
  mutate(()=>Object.assign(a,{name,type,opening:round(opening)}),'Account updated');closeModal();break;}
 case 'recurring-form':case 'recurring-edit-form':{
  const title=get('title').slice(0,60),day=Number(get('day')),category=get('category'),accountId=get('accountId');if(!title||!validAmount(get('amount'))||!Number.isInteger(day)||day<1||day>31||!account(accountId)||!expenseCategories().includes(category))return toast('Check the recurring bill details.',true);
  const existing=form.id==='recurring-edit-form'?db.recurring.find(b=>b.id===form.dataset.id):null;const bill={id:existing?.id||id(),title,amount,day,category,accountId,active:existing?.active??true};mutate(()=>{if(existing)Object.assign(existing,bill);else db.recurring.push(bill);},existing?'Recurring bill updated':'Recurring bill added');closeModal();break;}
 case 'goal-form':{
  const name=get('name').slice(0,60),target=get('target');if(!name||!validAmount(target))return toast('Enter a valid savings goal.',true);
  mutate(()=>db.goals.push({id:id(),name,target:round(target)}),'Savings goal created');break;}
 case 'savings-form':{
  const goalId=form.dataset.goal,kind=form.dataset.kind,g=goal(goalId),date=get('date'),accountId=get('accountId');if(!g||!account(accountId)||!['saving','unsaving'].includes(kind)||!validAmount(get('amount'))||!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Enter valid savings details.',true);
  if(kind==='unsaving'&&amount>goalSaved(goalId))return toast('You cannot withdraw more than this goal contains.',true);
  mutate(()=>db.transactions.push({id:id(),kind,amount,date,accountId,goalId,description:kind==='saving'?'Savings deposit':'Savings withdrawal',createdAt:new Date().toISOString()}),'Savings transfer recorded');closeModal();break;}
 case 'savings-edit-form':{
  const t=db.transactions.find(t=>t.id===form.dataset.id),date=get('date'),accountId=get('accountId');if(!t||!['saving','unsaving'].includes(t.kind)||!validAmount(get('amount'))||!account(accountId)||!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Enter valid savings details.',true);
  const hypothetical=goalSaved(t.goalId)+(t.kind==='saving'?amount-t.amount:t.amount-amount);if(hypothetical<0)return toast('This edit would make the savings goal negative.',true);
  mutate(()=>Object.assign(t,{amount,date,accountId}),'Savings transaction updated');closeModal();break;}
 }}
function handleInput(event){const el=event.target;
 if(el.id==='afford-item'){ui.afford.item=el.value;return;}if(el.id==='afford-price'){ui.afford.price=el.value;updateAfford();return;}if(el.id==='afford-category'){ui.afford.category=el.value;updateAfford();return;}if(el.id==='afford-priority'){ui.afford.priority=el.value;updateAfford();return;}
 if(el.id==='tx-search'){ui.txSearch=el.value;const pos=el.selectionStart;render();const next=$('#tx-search');next?.focus();try{next?.setSelectionRange(pos,pos);}catch(_){}return;}
}
function handleChange(event){const el=event.target;

 if(el.id==='tx-kind'){ui.txKind=el.value;render();return;}
 if(el.id==='modal-kind'){const kind=el.value;$('#modal-category-box').style.display=kind==='transfer'?'none':'';$('#modal-to-box').style.display=kind==='transfer'?'':'none';$('#modal-from-label').textContent=kind==='transfer'?'From account':'Account';const selected=$('#modal-category').value;$('#modal-category').innerHTML=categoryOptions(kind==='income'?(INCOME_CATS.includes(selected)?selected:'Salary'):expenseCategories().includes(selected)?selected:'Food & Drinks',kind);return;}
 if(el.name==='accountId'&&$('#transaction-form')?.contains(el)&&$('#modal-kind')?.value==='transfer'){$('#modal-to-box select').innerHTML=accountOptions(db.accounts.find(a=>a.id!==el.value)?.id,el.value);return;}

}
function updateAfford(){const el=$('#afford-output');if(el)el.innerHTML=affordabilityResult();}
function handleClick(event){const tab=event.target.closest('[data-tab]');if(tab){ui.tab=tab.dataset.tab;render();window.scrollTo?.({top:0,behavior:'instant'});return;}
 const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action,ident=el.dataset.id;
 if(action==='backdrop'){if(el===event.target)closeModal();return;}
 if(action==='close-modal'){closeModal();return;}
 if(action==='new-tx'){transactionModal();return;}
 if(action==='theme'){setTheme(db.settings.theme==='dark'?'light':'dark');return;}
 if(action==='set-theme'){setTheme(el.dataset.value);return;}
 if(action==='go-settings-budget'){ui.tab='settings';ui.settingsTab='budget';render();return;}
 if(action==='go-recurring'){ui.tab='settings';ui.settingsTab='recurring';render();return;}
 if(action==='settings-tab'){ui.settingsTab=el.dataset.value;render();return;}
 if(action==='edit-tx'){const t=db.transactions.find(x=>x.id===ident);if(!t)return;if(['saving','unsaving'].includes(t.kind))savingsEditModal(t);else transactionModal(t);return;}
 if(action==='delete-tx'){const t=db.transactions.find(x=>x.id===ident);if(!t)return;if(t.kind==='saving'&&goalSaved(t.goalId)-t.amount<0)return toast('Withdraw the savings first before deleting this deposit.',true);if(!confirm('Delete this transaction? This cannot be undone.'))return;mutate(()=>db.transactions=db.transactions.filter(x=>x.id!==ident),'Transaction deleted');return;}
 if(action==='cal-prev'){ui.calendarMonth=previousMonth(ui.calendarMonth);ui.txMonth=ui.calendarMonth;ui.selectedDay='';render();return;}
 if(action==='cal-next'){ui.calendarMonth=nextMonth(ui.calendarMonth);ui.txMonth=ui.calendarMonth;ui.selectedDay='';render();return;}
 if(action==='pick-day'){ui.selectedDay=ui.selectedDay===el.dataset.date?'':el.dataset.date;ui.txMonth=ui.calendarMonth;render();return;}
 if(action==='clear-day'){ui.selectedDay='';render();return;}
 if(action==='wishlist-save'){const p=Number(ui.afford.price);if(!validAmount(ui.afford.price)||!ui.afford.item.trim())return toast('Enter an item name and valid price first.',true);mutate(()=>db.wishlist.unshift({id:id(),name:ui.afford.item.trim().slice(0,100),price:round(p),category:ui.afford.category,priority:ui.afford.priority,addedAt:today()}),'Added to your wishlist');return;}
 if(action==='wishlist-check'){const w=db.wishlist.find(x=>x.id===ident);if(w){ui.afford={item:w.name,price:String(w.price),category:w.category,priority:w.priority};render();window.scrollTo?.({top:0,behavior:'smooth'});}return;}
 if(action==='wishlist-delete'){mutate(()=>db.wishlist=db.wishlist.filter(x=>x.id!==ident),'Removed from wishlist');return;}
 if(action==='purchase-record'){if(!validAmount(ui.afford.price))return toast('Enter a valid purchase price first.',true);transactionModal(null,{kind:'expense',description:ui.afford.item,amount:round(ui.afford.price),category:ui.afford.category,date:today()});return;}
 if(action==='category-limit'){categoryModal(el.dataset.category);return;}
 if(action==='edit-account'){const a=account(ident);if(a)accountModal(a);return;}
 if(action==='delete-account'){const a=account(ident);if(!a)return;if(db.accounts.length<=1)return toast('Keep at least one account.',true);if(db.transactions.some(t=>t.accountId===ident||t.toAccountId===ident)||db.recurring.some(b=>b.accountId===ident))return toast('This account has transactions or recurring bills. Reassign/remove them before deleting.',true);if(!confirm(`Remove the account "${a.name}"?`))return;mutate(()=>db.accounts=db.accounts.filter(x=>x.id!==ident),'Account removed');return;}
 if(action==='recurring-toggle'){const b=db.recurring.find(x=>x.id===ident);if(b)mutate(()=>b.active=b.active===false?true:false,b.active===false?'Bill resumed':'Bill status updated');return;}
 if(action==='recurring-pay'){const b=db.recurring.find(x=>x.id===ident);if(!b||recurringPaid(b))return toast('Already recorded as paid this month.',true);if(!confirm(`Record ${money(b.amount)} for ${b.title} as an expense today?`))return;mutate(()=>db.transactions.push({id:id(),kind:'expense',amount:round(b.amount),date:today(),accountId:b.accountId,category:b.category,description:b.title,recurringId:b.id,createdAt:new Date().toISOString()}),'Bill recorded as paid');return;}
 if(action==='recurring-edit'){const b=db.recurring.find(x=>x.id===ident);if(b)recurringModal(b);return;}
 if(action==='recurring-delete'){const b=db.recurring.find(x=>x.id===ident);if(b&&confirm(`Remove recurring schedule for ${b.title}? Previously recorded payments will be kept.`))mutate(()=>db.recurring=db.recurring.filter(x=>x.id!==ident),'Recurring schedule removed');return;}
 if(action==='goal-deposit'||action==='goal-withdraw'){const g=goal(ident);if(g)savingsModal(g,action==='goal-deposit'?'saving':'unsaving');return;}
 if(action==='delete-goal'){const g=goal(ident);if(!g)return;if(db.transactions.some(t=>t.goalId===ident))return toast('This goal has transfer history. Keep it to preserve your ledger and balances.',true);if(confirm(`Delete savings goal "${g.name}"?`))mutate(()=>db.goals=db.goals.filter(x=>x.id!==ident),'Savings goal removed');return;}
 if(action==='export-csv'){exportCSV();return;}
 if(action==='export-json'){downloadText(`moneyflow-backup-${today()}.json`,JSON.stringify(db,null,2),'application/json');toast('JSON backup downloaded');return;}
 if(action==='load-demo'){if(!confirm('Replace all current MoneyFlow data with fictional sample data? Export a backup first if needed.'))return;db=buildDemo();save();ui={...ui,tab:'home',settingsTab:'budget',calendarMonth:thisMonth(),txMonth:thisMonth(),selectedDay:'',txSearch:'',txKind:'all'};render();toast('Sample data loaded');return;}
 if(action==='clear-all'){if(!confirm('Delete ALL your local MoneyFlow data? This cannot be undone without a backup.'))return;if(!confirm('Final confirmation: permanently erase all MoneyFlow financial records from this browser?'))return;db=seedState();save();ui={...ui,tab:'home',settingsTab:'budget',calendarMonth:thisMonth(),txMonth:thisMonth(),selectedDay:'',txSearch:'',txKind:'all'};render();toast('Local data erased');return;}
}
function csvCell(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s)&&typeof v==='string')s="'"+s;return `"${s.replace(/"/g,'""')}"`;}
function downloadText(filename,text,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download=filename;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportCSV(){const columns=['Date','Type','Description','Category','Amount RM','From account','To account','Savings goal','Recurring bill ID'];const lines=db.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.kind,description(t),t.category||'',t.amount,account(t.accountId)?.name||'',account(t.toAccountId)?.name||'',goal(t.goalId)?.name||'',t.recurringId||''].map(csvCell).join(','));downloadText(`moneyflow-transactions-${today()}.csv`,[columns.map(csvCell).join(','),...lines].join('\r\n'),'text/csv;charset=utf-8');toast('Transaction CSV downloaded');}
async function importBackup(file){if(!file)return;if(file.size>5*1024*1024)return toast('Backup too large (maximum 5 MB).',true);try{const input=JSON.parse(await file.text());const parsed=normalize(input);if(parsed.accounts.length<1||parsed.accounts.length>500||parsed.transactions.length>50000||parsed.goals.length>500||parsed.recurring.length>1000||parsed.wishlist.length>5000)throw Error('Unexpected record count');const kinds=new Set(['income','expense','transfer','saving','unsaving']),acctIds=new Set(parsed.accounts.map(a=>a.id)),goalIds=new Set(parsed.goals.map(g=>g.id));if(parsed.transactions.some(t=>!kinds.has(t.kind)||!validAmount(t.amount)||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!acctIds.has(t.accountId)||(t.kind==='transfer'&&(!acctIds.has(t.toAccountId)||t.toAccountId===t.accountId))||(['saving','unsaving'].includes(t.kind)&&!goalIds.has(t.goalId))))throw Error('Invalid transaction data');if(!confirm('Replace your current MoneyFlow data with the selected backup?'))return;db=parsed;save();ui={...ui,tab:'home',settingsTab:'budget',calendarMonth:thisMonth(),txMonth:thisMonth(),selectedDay:'',txSearch:'',txKind:'all'};render();toast('Backup restored successfully');}catch(err){console.error(err);toast('Could not restore backup: invalid or unsupported file.',true);}}
function buildDemo(){const data=seedState();data.demo=true;data.settings={...data.settings,monthlyBudget:1800,protectedReserve:180,warningCushion:40,categoryBudgets:{'Food & Drinks':480,Transport:250,Shopping:420,Bills:400}};data.accounts=[{id:'cash',name:'Cash',type:'cash',opening:200},{id:'bank',name:'Maybank',type:'bank',opening:1850},{id:'wallet',name:'Touch ‘n Go',type:'wallet',opening:130},{id:'card',name:'Credit Card',type:'credit',opening:-95}];data.goals=[{id:'goal_1',name:'Emergency fund',target:2000},{id:'goal_2',name:'New laptop',target:3500}];data.recurring=[{id:'bill_1',title:'Mobile plan',amount:48,day:10,category:'Bills',accountId:'bank',active:true},{id:'bill_2',title:'Spotify',amount:16.9,day:20,category:'Entertainment',accountId:'bank',active:true},{id:'bill_3',title:'Internet',amount:99,day:27,category:'Bills',accountId:'bank',active:true}];const d=new Date(),day=Math.max(1,d.getDate()),currentMonth=thisMonth();const put=(kind,amount,desc,category,accountId,daysAgo=0,extras={})=>{const dt=new Date();dt.setDate(dt.getDate()-daysAgo);data.transactions.push({id:id(),date:localDate(dt),kind,amount,description:desc,category,accountId,createdAt:new Date().toISOString(),...extras});};put('income',2200,'Monthly allowance','Allowance','bank',Math.min(day-1,3));put('income',350,'Freelance design','Freelance','bank',0);put('expense',16.5,'Nasi lemak & tea','Food & Drinks','wallet',0);put('expense',12,'Coffee & toast','Food & Drinks','cash',1);put('expense',42.5,'Fuel top-up','Transport','bank',Math.min(day-1,2));put('expense',28,'Lunch with friends','Food & Drinks','wallet',Math.min(day-1,3));put('expense',89,'New T-shirt','Shopping','card',Math.min(day-1,4));put('expense',68,'Groceries','Groceries','bank',Math.min(day-1,6));put('expense',25,'Movie ticket','Entertainment','wallet',Math.min(day-1,7));put('saving',150,'Emergency fund deposit','','bank',Math.min(day-1,2),{goalId:'goal_1'});put('saving',100,'Laptop fund deposit','','bank',Math.min(day-1,3),{goalId:'goal_2'});put('transfer',70,'Transfer to e-wallet','','bank',Math.min(day-1,2),{toAccountId:'wallet'});put('expense',48,'Mobile plan','Bills','bank',0,{recurringId:'bill_1'});for(let i=1;i<=5;i++){const dt=new Date(d.getFullYear(),d.getMonth()-i,14),m=localDate(dt);data.transactions.push({id:id(),date:m,kind:'expense',amount:1900+i*80,description:'Monthly living expenses',category:'Food & Drinks',accountId:'bank',createdAt:new Date().toISOString()},{id:id(),date:m,kind:'income',amount:2100+i*65,description:'Monthly allowance',category:'Allowance',accountId:'bank',createdAt:new Date().toISOString()});}data.wishlist=[{id:id(),name:'Wireless headphones',price:240,category:'Shopping',priority:'want',addedAt:today()}];return data;}

document.addEventListener('input',handleInput);
document.addEventListener('change',handleChange);
